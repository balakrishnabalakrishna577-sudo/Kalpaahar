<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KalpAahar{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(145deg, #f0f7f2 0%, #e8f5ec 50%, #f7f5ef 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(46,139,87,0.14);
      padding: 48px 44px;
      width: 100%;
      max-width: 460px;
    }
    .brand {
      text-align: center;
      margin-bottom: 32px;
    }
    .brand-leaf {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #5CB85C, #2E8B57);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .brand-leaf svg { width: 28px; height: 28px; color: #fff; fill: none; stroke: currentColor; stroke-width: 2; }
    .brand h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #1e2a22;
      margin: 0 0 4px;
    }
    .brand p { font-size: .88rem; color: #5c6b60; margin: 0; }

    h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: #1e2a22;
      margin: 0 0 6px;
    }
    .subtitle { font-size: .9rem; color: #5c6b60; margin: 0 0 28px; }

    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #1e2a22;
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #d8e8db;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-size: .93rem;
      color: #1e2a22;
      background: #f9fbf9;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .field input:focus {
      border-color: #2E8B57;
      box-shadow: 0 0 0 3px rgba(46,139,87,.12);
      background: #fff;
    }
    .field .error-text {
      font-size: .8rem;
      color: #dc3545;
      margin-top: 5px;
    }
    .field input.is-error { border-color: #dc3545; }

    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 480px) { .field-row { grid-template-columns: 1fr; } }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #5CB85C, #2E8B57);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 12px 28px rgba(46,139,87,.3);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(46,139,87,.4);
    }

    .form-error {
      background: #fdf2f2;
      border: 1px solid #f5c6cb;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .88rem;
      color: #721c24;
      margin-bottom: 20px;
    }

    .alt-link {
      text-align: center;
      margin-top: 24px;
      font-size: .88rem;
      color: #5c6b60;
    }
    .alt-link a {
      color: #2E8B57;
      font-weight: 600;
      text-decoration: none;
    }
    .alt-link a:hover { text-decoration: underline; }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: .82rem;
      color: #8ba890;
      text-decoration: none;
    }
    .back-home:hover { color: #2E8B57; }

    .messages-list { list-style: none; padding: 0; margin: 0 0 18px; }
    .messages-list li {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: .88rem;
      margin-bottom: 8px;
    }
    .messages-list li.success { background: #d4edda; color: #155724; }
    .messages-list li.error   { background: #f8d7da; color: #721c24; }
    .messages-list li.info    { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="brand">
    <div class="brand-leaf">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>
    <h1>KalpAahar</h1>
    <p>Nutrition &amp; Wellness by Dr. Sayali Nahar</p>
  </div>

  {% if messages %}
    <ul class="messages-list">
      {% for msg in messages %}
        <li class="{{ msg.tags }}">{{ msg }}</li>
      {% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}

  <a href="/" class="back-home">← Back to homepage</a>
</div>
</body>
</html>
